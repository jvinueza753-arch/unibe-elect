name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [identidad, elecciones, votacion, resultados]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: services/${{ matrix.service }}
      - run: npx prisma generate
        working-directory: services/${{ matrix.service }}
        env: { DATABASE_URL: postgresql://x:x@localhost:5432/x }
      - run: npm test --if-present -- --passWithNoTests
        working-directory: services/${{ matrix.service }}
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  integration:
    runs-on: ubuntu-latest
    needs: [checks, frontend]
    env:
      E2E_VOLUME_PREFIX: unibe-elect-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start isolated Compose E2E stack
        run: docker compose -p unibe-elect-e2e -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
      - name: Wait for isolated gateway
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3100/health > /tmp/unibe-e2e-health.json; then
              break
            fi
            sleep 2
          done
          grep -q '"e2eAislado":true' /tmp/unibe-e2e-health.json
      - name: Run end-to-end flows
        run: node scripts/e2e.js
        env:
          E2E_API_URL: http://localhost:3100
          E2E_TEST_DATABASE_PREFIX: unibe_test
          E2E_ISOLATION_CONFIRMED: YES
      - name: Stop isolated Compose E2E stack
        if: always()
        run: docker compose -p unibe-elect-e2e -f docker-compose.yml -f docker-compose.e2e.yml down --remove-orphans -v
