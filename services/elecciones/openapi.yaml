openapi: 3.0.3
info:
  title: UNIBE Elect - elecciones
  version: 1.0.0
  description: API del microservicio elecciones.
servers:
  - url: http://localhost:4002
paths:
  /health:
    get:
      summary: Comprobar salud del servicio y base de datos
      responses:
        '200': { description: Servicio disponible }
        '503': { description: Base de datos no disponible }
  /api/v1/elecciones:
    post:
      summary: Crear un borrador de elección
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titulo, fechaApertura, fechaCierre]
              properties:
                titulo: { type: string }
                fechaApertura: { type: string, format: date-time }
                fechaCierre: { type: string, format: date-time }
                candidaturasRequeridas:
                  type: integer
                  minimum: 2
                  maximum: 100
                  default: 2
      responses:
        '201': { description: Borrador creado }
        '400': { description: Datos inválidos }
  /api/v1/elecciones/estudiante:
    get:
      summary: Listar elecciones elegibles con estado de participación del estudiante
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Elecciones programadas, abiertas o cerradas; no incluye votos por candidatura }
  /api/v1/elecciones/panel-administrador:
    get:
      summary: Consultar elecciones abiertas y participación agregada para administración
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Totales habilitados, participaciones y pendientes por elección }
        '503': { description: Servicio de identidad o votación no disponible }
  /api/v1/elecciones/{id}/participacion:
    get:
      summary: Consultar participación agregada de una elección abierta
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Totales y porcentaje de participación; no revela votos por candidatura }
        '403': { description: Estudiante no habilitado }
        '422': { description: Elección no abierta }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
